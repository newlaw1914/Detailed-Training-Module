<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSOC-TRN-004 — Self-Paced Operator Learning Module · Specialized GSOC</title>
<link rel="preconnect" href="https://api.fontshare.com">
<style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,400;112,600;112,700&display=swap');

  :root{
    /* ---- Specialized core palette · Brand Guidelines v1.0.1 ---- */
    --black:#000000;
    --prism:#512FFF;          /* Lighter Prismatic — dark backgrounds only */
    --prism-dark:#3F1DF8;     /* Darker Prismatic */
    --prism-deep:#190935;
    --shark:#92989B;
    --frost:#E8EAEF;
    /* ---- console surfaces derived from black ---- */
    --ink:#05060A;
    --panel:#0E1017;
    --panel-2:#151824;
    --panel-3:#1D2130;
    --line:#23262F;
    --line-soft:#171A22;
    --prism-soft:rgba(81,47,255,.13);
    --prism-line:#332B7A;
    /* ---- operational state colors · never used as brand ---- */
    --amber:#E0A93B;
    --red:#D64545;
    --green:#4FB286;
    /* ---- type system ---- */
    --term:'Termina','Archivo','Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
    --mori:'PP Mori','General Sans','Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
    --sans:'General Sans','Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--frost);font-family:var(--sans);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
  a{color:#9C86FF}
  h1,h2,h3,h4{font-family:var(--term);font-weight:600;letter-spacing:-.01em;margin:0}
  h1{font-size:34px;line-height:1.1}
  h2{font-size:22px;line-height:1.2;margin:0 0 12px}
  h3{font-size:15.5px;letter-spacing:.02em;margin:0 0 8px}
  p{margin:0 0 13px}
  ul,ol{margin:0 0 14px;padding-left:20px}
  li{margin:0 0 7px}
  b,strong{font-weight:600;color:#fff}

  /* ================= brand devices ================= */
  .wordmark{font-family:var(--term);font-weight:600;letter-spacing:.34em;text-transform:uppercase;font-size:12px;color:var(--prism);white-space:nowrap}
  .wordmark.frost{color:var(--frost)}
  .trio{width:16px;height:15px;flex:0 0 auto;color:var(--prism)}
  .trio path{stroke:currentColor}
  .cropmark{position:fixed;right:-58px;bottom:-58px;width:250px;height:230px;z-index:0;color:var(--prism);opacity:.055;pointer-events:none}
  .brandbar{display:flex;height:3px;margin:0 0 18px;border-radius:2px;overflow:hidden}
  .brandbar i{display:block;height:3px}
  .brandbar i:nth-child(1){width:14%;background:#0A0A0A;border-top:1px solid var(--line)}
  .brandbar i:nth-child(2){width:26%;background:var(--frost)}
  .brandbar i:nth-child(3){width:60%;background:var(--prism)}
  .rule{height:1px;background:var(--line);margin:0 0 14px}

  /* ================= chrome ================= */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px 20px;background:rgba(5,6,10,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(9px)}
  .docid{font-family:var(--mono);font-size:10.5px;color:var(--shark);letter-spacing:.09em;text-transform:uppercase}
  .clock{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--frost);display:flex;align-items:center;gap:8px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(79,178,134,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,178,134,.55)}70%{box-shadow:0 0 0 9px rgba(79,178,134,0)}100%{box-shadow:0 0 0 0 rgba(79,178,134,0)}}
  .progwrap{position:sticky;top:47px;z-index:39;height:2px;background:var(--line-soft)}
  .progbar{height:2px;width:0;background:linear-gradient(90deg,var(--prism-dark),var(--prism));transition:width .4s ease}

  .shell{display:grid;grid-template-columns:274px 1fr;position:relative;z-index:1}
  .rail{border-right:1px solid var(--line);position:sticky;top:49px;height:calc(100vh - 49px);overflow:auto;padding:16px 0 60px;background:#070810}
  .railhead{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--shark);padding:0 18px 10px}
  .railunit{font-family:var(--term);font-size:9.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--prism);padding:14px 18px 6px;border-top:1px solid var(--line-soft);margin-top:6px}
  .navitem{display:flex;gap:10px;align-items:flex-start;width:100%;background:transparent;border:0;border-left:2px solid transparent;color:var(--shark);font:inherit;font-size:13.4px;text-align:left;padding:7px 18px;cursor:pointer;line-height:1.35}
  .navitem:hover{color:var(--frost);background:#0B0D15}
  .navitem.on{color:#fff;border-left-color:var(--prism);background:var(--prism-soft)}
  .navitem.done .n{color:var(--green)}
  .navitem .n{font-family:var(--mono);font-size:10.5px;color:#4A4F5C;padding-top:2px;min-width:19px}
  main{padding:34px 46px 170px;max-width:930px}

  /* ================= cover ================= */
  .cover{background:linear-gradient(140deg,#000 0%,var(--prism-deep) 46%,var(--prism-dark) 100%);border-radius:8px;padding:44px 40px 38px;margin:0 0 26px;position:relative;overflow:hidden}
  .covermark{position:absolute;right:-42px;top:-30px;width:230px;height:212px;color:#fff;opacity:.11}
  .cover h1{font-size:40px;margin:14px 0 12px;color:#fff}
  .cover .tag{font-family:var(--mori);font-size:15.5px;color:rgba(255,255,255,.84);margin:0}
  .kv{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.62);letter-spacing:.05em;line-height:1.8}
  .subline{font-family:var(--mori);font-size:16.5px;line-height:1.6;color:#CFD3DD;margin:0 0 24px}

  .eyebrow{font-family:var(--term);font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--prism);margin:0 0 9px}
  .sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
  .sechead .num{font-family:var(--term);font-size:11px;font-weight:600;color:#3A3F4D;letter-spacing:.14em}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin:0 0 24px}
  .stat{background:var(--panel);padding:14px 14px 12px;border:1px solid var(--line);border-radius:5px}
  .stat b{display:block;font-family:var(--term);font-weight:600;font-size:25px;line-height:1;color:var(--frost)}
  .stat span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--shark);margin-top:7px}

  /* ================= cards ================= */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:0 0 18px}
  .card.tight{padding:14px 16px}
  .takeaway{background:linear-gradient(180deg,rgba(81,47,255,.11),rgba(81,47,255,.02));border-color:var(--prism-line)}
  .takeaway h3{color:#B7A6FF}
  .ctrl{border:1px solid var(--prism-line);border-left:3px solid var(--prism);border-radius:5px;background:linear-gradient(180deg,rgba(81,47,255,.09),rgba(81,47,255,.015));padding:13px 16px;margin:0 0 18px}
  .ctrl .lab{font-family:var(--term);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--prism);display:block;margin-bottom:5px;font-weight:600}
  .ctrl p{margin:0;font-size:14px}
  .lvl{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--frost);white-space:nowrap;vertical-align:1px}
  .lvl1{border-color:#33384A;color:#A9AFBD}.lvl2{border-color:#4A4433;color:#D8C08A}
  .lvl3{border-color:#3B4A44;color:#8FCDB0}.lvl4{border-color:#3A3577;color:#B0A2FF}
  .lvl5{border-color:#5C2C2C;color:#F0A0A0;background:rgba(214,69,69,.09)}
  .lvl6{border-color:#6B2E5C;color:#EDA6DA}
  .sopref{font-family:var(--mono);font-size:12px;color:#A99CE8;white-space:nowrap}
  .confirm{font-family:var(--mono);font-size:11px;color:var(--amber);border:1px dashed #5A4A22;border-radius:3px;padding:1px 6px;white-space:nowrap}
  .good{color:var(--green)}.risk{color:var(--amber)}.bad{color:var(--red)}
  .muted{color:var(--shark)}.small{font-size:12.8px}
  .kbd{font-family:var(--mono);font-size:11px;background:var(--panel-3);border:1px solid var(--line);border-radius:3px;padding:1px 6px}

  table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:13.6px}
  th{font-family:var(--term);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--shark);text-align:left;padding:8px 11px;border-bottom:1px solid var(--line)}
  td{padding:9px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tr:last-child td{border-bottom:0}

  /* ================= feed ================= */
  .feed{background:#020306;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 18px}
  .feedhead{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--shark)}
  .feedrow{display:grid;grid-template-columns:66px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid #101219;font-size:13.5px;animation:slidein .32s ease both}
  .feedrow:last-child{border-bottom:0}
  .feedrow .t{font-family:var(--mono);font-size:12px;color:var(--amber)}
  .feedrow.sys .t{color:var(--shark)}
  .feedrow.ok .t{color:var(--green)}
  .feedrow.crit{background:rgba(214,69,69,.07)}
  .feedrow.crit .t{color:var(--red)}
  @keyframes slidein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ================= buttons ================= */
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--prism);color:#fff;border:0;border-radius:4px;font-family:var(--sans);font-weight:600;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;padding:11px 18px;cursor:pointer}
  .btn:hover{background:#6444FF}
  .btn:disabled{background:#22252F;color:#5F6472;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--frost)}
  .btn.ghost:hover{border-color:var(--prism);background:var(--prism-soft)}
  .btn.sm{padding:8px 13px;font-size:10.5px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ================= interaction: mcq ================= */
  .cmp{margin:0 0 22px}
  .cmphead{display:flex;align-items:center;gap:9px;margin:0 0 11px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .cmptype{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--prism);border:1px solid var(--prism-line);border-radius:3px;padding:3px 7px;background:var(--prism-soft)}
  .cmpname{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--shark)}
  .cmpstate{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--shark)}
  .qwrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:0 0 12px}
  .prompt{font-family:var(--mori);font-weight:600;font-size:15px;margin:0 0 12px}
  .qn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--shark);display:block;margin-bottom:6px}
  .opts{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--frost);font:inherit;font-size:14px;padding:11px 13px;cursor:pointer;transition:.14s}
  .opt:hover:not(:disabled){border-color:var(--prism);background:#20232E}
  .opt .k{font-family:var(--mono);font-size:11px;color:var(--prism);padding-top:2px;min-width:15px}
  .opt.sel{border-color:var(--prism);background:var(--prism-soft)}
  .opt.right{border-color:var(--green);background:rgba(79,178,134,.10)}
  .opt.wrong{border-color:var(--red);background:rgba(214,69,69,.09)}
  .opt:disabled{cursor:default;opacity:.95}
  .just{display:none;font-size:13px;line-height:1.55;margin:-4px 0 4px;padding:9px 12px 9px 14px;border-left:2px solid var(--line);color:#BFC5D2;background:#0A0C12;border-radius:0 4px 4px 0}
  .just.show{display:block}
  .just.jr{border-left-color:var(--green)}
  .just.jw{border-left-color:var(--red)}
  .just b{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:3px}
  .just.jr b{color:var(--green)}.just.jw b{color:var(--red)}
  .fb{display:none;margin:10px 0 0;padding:12px 14px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);font-size:13.4px}
  .fb.show{display:block}
  .fb.pass{border-color:#2E5A47;background:rgba(79,178,134,.07)}
  .fb.fail{border-color:#5C3A3A;background:rgba(214,69,69,.07)}
  .fb .h{font-family:var(--term);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:6px}

  /* ================= interaction: reveal ================= */
  .revgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px;margin:0 0 12px}
  .rev{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;text-align:left;color:var(--frost);font:inherit;cursor:pointer;transition:.16s;position:relative}
  .rev:hover{border-color:var(--prism);transform:translateY(-1px)}
  .rev .rtop{padding:14px 15px 13px;display:block}
  .rev .rlab{font-family:var(--mono);font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--shark);display:block;margin-bottom:6px}
  .rev .rtitle{font-family:var(--term);font-weight:600;font-size:14px;display:block;line-height:1.3}
  .rev .rteaser{display:block;font-size:12.7px;color:var(--shark);margin-top:6px}
  .rev .rhint{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--prism)}
  .rev .rbody{display:none;padding:0 15px 15px;font-size:13.4px;line-height:1.58;border-top:1px solid var(--line-soft);margin-top:2px;padding-top:12px;animation:slidein .28s ease both}
  .rev.open{border-color:var(--prism-line);background:linear-gradient(180deg,rgba(81,47,255,.07),rgba(81,47,255,0))}
  .rev.open .rbody{display:block}
  .rev.open .rhint{display:none}
  .rev .rbody p:last-child{margin-bottom:0}

  /* ================= interaction: order ================= */
  .ord{list-style:none;padding:0;margin:0 0 12px;counter-reset:o}
  .ord li{display:flex;gap:11px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:0 0 7px;font-size:14px;cursor:grab;transition:.14s}
  .ord li:hover{border-color:var(--prism)}
  .ord li.drag{opacity:.4}
  .ord li.over{border-color:var(--prism);background:var(--prism-soft)}
  .ord li .grip{font-family:var(--mono);color:#464C5B;font-size:14px;letter-spacing:-2px}
  .ord li .pos{font-family:var(--term);font-size:11px;font-weight:600;color:var(--prism);min-width:20px}
  .ord li .txt{flex:1}
  .ord li .mv{display:flex;flex-direction:column;gap:2px}
  .ord li .mv button{background:transparent;border:1px solid var(--line);color:var(--shark);border-radius:3px;width:22px;height:15px;line-height:1;font-size:9px;cursor:pointer;padding:0}
  .ord li .mv button:hover{border-color:var(--prism);color:var(--frost)}
  .ord li.right{border-color:#2E5A47;background:rgba(79,178,134,.08)}
  .ord li.right .pos{color:var(--green)}
  .ord li.wrong{border-color:#5C3A3A;background:rgba(214,69,69,.07)}
  .ord li.wrong .pos{color:var(--red)}
  .ord li .why{display:block;font-size:12.4px;color:var(--shark);margin-top:3px}
  .ord.locked li{cursor:default}

  /* ================= interaction: sort / drag-drop bins ================= */
  .chiptray{display:flex;flex-wrap:wrap;gap:8px;background:#020306;border:1px dashed var(--line);border-radius:6px;padding:12px;min-height:56px;margin:0 0 14px}
  .chiptray.empty::after{content:'All items placed';font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#3D424F}
  .chip{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;color:var(--frost);font:inherit;font-size:13.2px;padding:7px 13px;cursor:grab;transition:.14s;text-align:left;max-width:100%}
  .chip:hover{border-color:var(--prism);background:#20232E}
  .chip.picked{border-color:var(--prism);background:var(--prism-soft);box-shadow:0 0 0 3px rgba(81,47,255,.14)}
  .chip.drag{opacity:.4}
  .chip.right{border-color:#2E5A47;background:rgba(79,178,134,.10)}
  .chip.wrong{border-color:#5C3A3A;background:rgba(214,69,69,.10)}
  .chip .cw{display:block;font-size:11.8px;color:var(--shark);margin-top:3px;white-space:normal}
  .bins{display:grid;gap:11px;margin:0 0 12px}
  .bin{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 13px;min-height:96px;transition:.14s}
  .bin.over{border-color:var(--prism);background:var(--prism-soft)}
  .bin .bh{font-family:var(--term);font-size:11.5px;font-weight:600;letter-spacing:.04em;margin-bottom:3px;display:block}
  .bin .bhint{font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--shark);display:block;margin-bottom:9px}
  .bin .bdrop{display:flex;flex-wrap:wrap;gap:7px;min-height:34px;align-content:flex-start}
  .binempty{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#343947;align-self:center}
  .dndnote{font-family:var(--mono);font-size:10.5px;color:var(--shark);letter-spacing:.05em;margin:0 0 12px}

  /* ================= interaction: hotspot ================= */
  .wall{background:#020306;border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 12px}
  .wallgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .tile{position:relative;background:#0A0C12;border:1px solid var(--line);border-radius:4px;padding:0;cursor:pointer;overflow:hidden;aspect-ratio:4/3;font:inherit;color:var(--frost);transition:.14s}
  .tile:hover{border-color:var(--prism)}
  .tile svg{display:block;width:100%;height:100%}
  .tile .tlab{position:absolute;left:6px;top:5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#7A828F;text-transform:uppercase}
  .tile .tstamp{position:absolute;right:6px;bottom:5px;font-family:var(--mono);font-size:9.5px;color:var(--amber)}
  .tile .tstamp.frozen{color:var(--red)}
  .tile.picked{border-color:var(--prism);box-shadow:inset 0 0 0 2px rgba(81,47,255,.5)}
  .tile.right{border-color:var(--green);box-shadow:inset 0 0 0 2px rgba(79,178,134,.5)}
  .tile.wrong{border-color:var(--red);box-shadow:inset 0 0 0 2px rgba(214,69,69,.45)}
  .tile .tmark{position:absolute;inset:auto 0 0 0;font-family:var(--mono);font-size:10px;padding:4px 6px;background:rgba(0,0,0,.72);display:none}
  .tile.marked .tmark{display:block}

  /* ================= interaction: branch ================= */
  .branch{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 14px}
  .brhead{display:flex;gap:11px;align-items:center;padding:11px 15px;background:linear-gradient(90deg,rgba(81,47,255,.16),rgba(81,47,255,.02));border-bottom:1px solid var(--line)}
  .brhead .sc{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--prism)}
  .brhead .ti{font-family:var(--term);font-size:13.5px;font-weight:600}
  .brhead .pt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--shark)}
  .brbody{padding:16px 18px}
  .node{animation:slidein .3s ease both}
  .nodetxt{font-family:var(--mori);font-size:14.8px;line-height:1.6;margin:0 0 14px}
  .nodetxt em{color:#CBD0DB;font-style:italic}
  .trail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .trail i{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--shark);border:1px solid var(--line);border-radius:3px;padding:3px 7px;font-style:normal}

  /* ================= textarea / rewrite ================= */

  /* ================= transcript ================= */

  .sc span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--shark);margin-top:7px}
  .meter{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-top:9px}
  .meter i{display:block;height:5px;background:linear-gradient(90deg,var(--prism-dark),var(--prism))}

  /* ================= decision log ================= */
  .log{position:fixed;right:0;bottom:0;z-index:50;width:334px;max-width:94vw;font-family:var(--mono);font-size:11.5px}
  .logtoggle{width:100%;background:var(--panel-2);border:1px solid var(--line);border-bottom:0;color:var(--frost);text-align:left;padding:9px 12px;cursor:pointer;letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;font-family:var(--mono)}
  .logbody{display:none;max-height:38vh;overflow:auto;background:#020306;border:1px solid var(--line);padding:10px 12px}

  .logbody div b{color:var(--frost);font-weight:400}

  .docstrip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--shark)}
  .docstrip .pg{margin-left:auto;color:var(--frost)}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 0}

  :focus-visible{outline:2px solid var(--prism);outline-offset:2px}
</style>
<svg class="cropmark" viewBox="0 0 100 92" aria-hidden="true">
  <path d="M50 11 L89 79 L11 79 Z" fill="none" stroke="currentColor" stroke-width="15" stroke-linejoin="round"/>
</svg>

<div class="topbar">
  <svg class="trio" viewBox="0 0 100 92" aria-hidden="true"><path d="M50 11 L89 79 L11 79 Z" fill="none" stroke-width="16" stroke-linejoin="round"/></svg>
  <div class="wordmark">Specialized</div>
  <div class="docid">GSOC-TRN-004 &middot; Self-paced operator module &middot; SOP-GSOC-000&ndash;018</div>
  <div class="clock"><span class="pulse"></span><span id="clock">--:--:--</span></div>
</div>
<div class="progwrap"><div class="progbar" id="progbar"></div></div>

<div class="shell">
  <nav class="rail" id="rail"><div class="railhead">Module contents</div></nav>
  <main id="main"></main>
</div>

<div class="log">
  <button class="logtoggle" id="logtoggle">&#9650; Decision log <span id="logcount" class="muted">(0)</span></button>
  <div class="logbody" id="logbody"><div class="muted">No entries.</div></div>
</div>
<script>
/* ==========================================================================
   GSOC-TRN-004 · Self-Paced Operator Learning Module
   Interaction engine — Specialized Global Security Operations Center
   Storyboard: SOP-GSOC-000 (Part A) through SOP-GSOC-018
   ========================================================================== */

const S = {
  page:0,
  done:new Set(),
  points:{},          /* id -> {earned,max,comp,unit} */
  log:[],
  flags:[],
  paths:{},           /* scenario -> Set of endings reached */
  confirms:new Set(),
  started:Date.now(),
  learner:''
};

/* ---------- clock ---------- */
setInterval(()=>{
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const el=document.getElementById('clock');
  if(el) el.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
},1000);

/* ---------- decision log ---------- */
function logIt(txt){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  S.log.unshift({t:p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()),x:txt});
  const b=document.getElementById('logbody');
  if(b) b.innerHTML=S.log.map(e=>`<div><b>${e.t}</b> &nbsp;${e.x}</div>`).join('');
  const c=document.getElementById('logcount');
  if(c) c.textContent='('+S.log.length+')';
}
document.getElementById('logtoggle').onclick=function(){
  const b=document.getElementById('logbody');
  b.classList.toggle('show');
  this.innerHTML=(b.classList.contains('show')?'&#9660;':'&#9650;')+' Decision log <span id="logcount" class="muted">('+S.log.length+')</span>';
};

function score(id,earned,max,comp,unit){ S.points[id]={earned,max,comp,unit:unit||UNIT_OF[S.page]||'—'}; }
function flag(txt){ if(!S.flags.includes(txt)) S.flags.push(txt); }
function totals(){
  let e=0,m=0; Object.values(S.points).forEach(p=>{e+=p.earned;m+=p.max});
  return {e,m,pct:m?Math.round(e/m*100):0};
}

/* ---------- inline brand + doc helpers ---------- */
const LVL  = n => `<span class="lvl lvl${n}">LEVEL ${n}</span>`;
const SOP  = t => `<span class="sopref">${t}</span>`;
const CF   = t => `<span class="confirm">[CONFIRM: ${t}]</span>`;
const CTRL = t => `<div class="ctrl"><span class="lab">Control</span><p>${t}</p></div>`;
const BAR  = `<div class="brandbar"><i></i><i></i><i></i></div>`;
const TRIO = `<svg class="trio" viewBox="0 0 100 92" aria-hidden="true"><path d="M50 11 L89 79 L11 79 Z" fill="none" stroke-width="16" stroke-linejoin="round"/></svg>`;
function feed(rows){
  return `<div class="feed"><div class="feedhead">${TRIO}<span>Console feed &mdash; simulated</span></div>`+
    rows.map(r=>`<div class="feedrow ${r[2]||''}"><span class="t">${r[0]}</span><span>${r[1]}</span></div>`).join('')+`</div>`;
}

/* ---------- mount queue ---------- */
let QUEUE=[], UID=0;
const nid = p => p+'_'+(++UID);
function head(type,name,state){
  return `<div class="cmphead"><span class="cmptype">${type}</span><span class="cmpname">${name}</span><span class="cmpstate" data-state>${state||'Not attempted'}</span></div>`;
}
function setState(root,txt){ const s=root.querySelector('[data-state]'); if(s) s.textContent=txt; }

/* seeded shuffle so a task never opens in the correct order by accident */
function shuffle(n,seed){
  const a=[...Array(n).keys()]; let s=seed||7;
  for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.every((v,i)=>v===i)) a.reverse();
  return a;
}

/* ==========================================================================
   1 · PRACTICE QUESTIONS — reveals correct answer and a justification for
       every option, right and wrong
   ========================================================================== */
function cmpQuiz(o){
  const id=nid('q'); QUEUE.push(()=>wireQuiz(id,o));
  return `<div class="cmp" id="${id}">${head('Practice questions',o.name||'Check your judgment')}
    <div data-body></div></div>`;
}
function wireQuiz(id,o){
  const root=document.getElementById(id), body=root.querySelector('[data-body]');
  const items=o.items; let answered=0, earned=0, max=items.length*4;
  items.forEach((it,ix)=>{
    const multi=!!it.multi, sel=new Set();
    const w=document.createElement('div'); w.className='qwrap';
    w.innerHTML=`<span class="qn">Question ${ix+1} of ${items.length}${multi?' &middot; select all that apply':''}</span><p class="prompt">${it.q}</p>`;
    const ow=document.createElement('div'); ow.className='opts';
    it.opts.forEach((op,ci)=>{
      const b=document.createElement('button');
      b.className='opt'; b.type='button';
      b.innerHTML=`<span class="k">${String.fromCharCode(65+ci)}</span><span>${op[0]}</span>`;
      b.onclick=()=>{
        if(multi){ sel.has(ci)?sel.delete(ci):sel.add(ci); b.classList.toggle('sel'); }
        else { sel.clear(); sel.add(ci); [...ow.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); }
        chk.disabled=sel.size===0;
      };
      ow.appendChild(b);
      const j=document.createElement('div'); j.className='just'; j.dataset.j=ci; ow.appendChild(j);
    });
    const bar=document.createElement('div'); bar.className='btnrow';
    const chk=document.createElement('button'); chk.className='btn sm'; chk.type='button'; chk.textContent='Check answer'; chk.disabled=true;
    const fb=document.createElement('div'); fb.className='fb';
    chk.onclick=()=>{
      const right=it.opts.map((o2,i)=>o2[1]?i:-1).filter(i=>i>=0);
      const mine=[...sel].sort((a,b)=>a-b);
      const ok = mine.length===right.length && mine.every((v,k)=>v===right[k]);
      [...ow.children].forEach(node=>{
        if(node.classList.contains('opt')){
          const ci=[...ow.children].filter(n=>n.classList.contains('opt')).indexOf(node);
          node.disabled=true;
          if(it.opts[ci][1]) node.classList.add('right');
          else if(sel.has(ci)) node.classList.add('wrong');
        }
      });
      ow.querySelectorAll('.just').forEach(j=>{
        const ci=+j.dataset.j, correct=it.opts[ci][1];
        j.className='just show '+(correct?'jr':'jw');
        j.innerHTML=`<b>${correct?'Why '+String.fromCharCode(65+ci)+' is right':'Why '+String.fromCharCode(65+ci)+' is wrong'}</b>${it.opts[ci][2]}`;
      });
      chk.disabled=true;
      fb.className='fb show '+(ok?'pass':'fail');
      fb.innerHTML=`<span class="h">${ok?'Correct':'Not correct'}</span>${it.note||''}`;
      earned+= ok?4:1; answered++;
      if(!ok && it.flag) flag(it.flag);
      logIt('Practice question '+(ok?'correct':'incorrect')+' &mdash; '+(o.name||'quiz'));
      setState(root,answered+' of '+items.length+' answered &middot; '+earned+'/'+(answered*4)+' pts');
      score(id,earned,max,o.comp);
      if(answered===items.length) S.done.add(S.page), paint();
    };
    bar.appendChild(chk);
    w.append(ow,bar,fb); body.appendChild(w);
  });
  score(id,0,max,o.comp);
}

/* ==========================================================================
   2 · CLICK AND REVEAL
   ========================================================================== */
function cmpReveal(o){
  const id=nid('r'); QUEUE.push(()=>wireReveal(id,o));
  return `<div class="cmp" id="${id}">${head('Click and reveal',o.name||'Open every card')}
    ${o.lead?`<p class="small muted">${o.lead}</p>`:''}<div class="revgrid" data-body></div></div>`;
}
function wireReveal(id,o){
  const root=document.getElementById(id), body=root.querySelector('[data-body]');
  let open=0; const n=o.cards.length;
  o.cards.forEach(c=>{
    const b=document.createElement('button'); b.className='rev'; b.type='button';
    b.innerHTML=`<span class="rtop">
        <span class="rlab">${c.lab||''}</span>
        <span class="rtitle">${c.title}</span>
        ${c.teaser?`<span class="rteaser">${c.teaser}</span>`:''}
        <span class="rhint">Reveal &rarr;</span>
      </span><div class="rbody">${c.body}</div>`;
    b.onclick=()=>{
      const was=b.classList.contains('open');
      b.classList.toggle('open');
      if(!was){ open++; setState(root,open+' of '+n+' revealed');
        if(open===n){ score(id,3,3,o.comp); S.done.add(S.page); paint(); logIt('Revealed all &mdash; '+(o.name||'cards')); } }
    };
    body.appendChild(b);
  });
  score(id,0,3,o.comp);
  setState(root,'0 of '+n+' revealed');
}

/* ==========================================================================
   3 · DRAG TO ORDER — sequence tasks
   ========================================================================== */
function cmpOrder(o){
  const id=nid('o'); QUEUE.push(()=>wireOrder(id,o));
  return `<div class="cmp" id="${id}">${head('Drag to order',o.name||'Put the steps in sequence')}
    <p class="prompt">${o.prompt}</p>
    <p class="dndnote">Drag a row, or use the arrows, until the sequence is right. Then check it.</p>
    <ul class="ord" data-body></ul><div class="btnrow" data-bar></div><div class="fb" data-fb></div></div>`;
}
function wireOrder(id,o){
  const root=document.getElementById(id), ul=root.querySelector('[data-body]'),
        bar=root.querySelector('[data-bar]'), fb=root.querySelector('[data-fb]');
  let order=shuffle(o.items.length,o.seed||13);
  let dragFrom=null, locked=false;

  function draw(){
    ul.innerHTML='';
    order.forEach((srcIdx,pos)=>{
      const it=o.items[srcIdx];
      const li=document.createElement('li');
      li.draggable=!locked; li.dataset.pos=pos;
      li.innerHTML=`<span class="grip">&#8942;&#8942;</span><span class="pos">${pos+1}</span>
        <span class="txt">${it.t}<span class="why" data-why></span></span>
        <span class="mv"><button type="button" data-up>&#9650;</button><button type="button" data-dn>&#9660;</button></span>`;
      if(locked){
        const ok = srcIdx===pos;
        li.classList.add(ok?'right':'wrong');
        li.querySelector('[data-why]').innerHTML = ok ? (it.why||'') :
          `Belongs at position ${srcIdx+1}. ${it.why||''}`;
        li.querySelector('.mv').remove();
      } else {
        li.querySelector('[data-up]').onclick=e=>{e.stopPropagation(); if(pos>0){ [order[pos-1],order[pos]]=[order[pos],order[pos-1]]; draw(); }};
        li.querySelector('[data-dn]').onclick=e=>{e.stopPropagation(); if(pos<order.length-1){ [order[pos+1],order[pos]]=[order[pos],order[pos+1]]; draw(); }};
        li.ondragstart=e=>{dragFrom=pos; li.classList.add('drag'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(pos))}catch(_){}};
        li.ondragend=()=>{li.classList.remove('drag'); ul.querySelectorAll('li').forEach(x=>x.classList.remove('over'))};
        li.ondragover=e=>{e.preventDefault(); li.classList.add('over')};
        li.ondragleave=()=>li.classList.remove('over');
        li.ondrop=e=>{
          e.preventDefault(); li.classList.remove('over');
          const to=pos; if(dragFrom===null||dragFrom===to) return;
          const moved=order.splice(dragFrom,1)[0]; order.splice(to,0,moved); dragFrom=null; draw();
        };
      }
      ul.appendChild(li);
    });
    ul.classList.toggle('locked',locked);
  }
  const chk=document.createElement('button'); chk.className='btn sm'; chk.type='button'; chk.textContent='Check sequence';
  chk.onclick=()=>{
    locked=true; draw(); chk.disabled=true;
    const right=order.filter((v,i)=>v===i).length, n=order.length;
    const ok=right===n;
    fb.className='fb show '+(ok?'pass':'fail');
    fb.innerHTML=`<span class="h">${ok?'Sequence correct':right+' of '+n+' positions correct'}</span>${o.explain}`;
    score(id, ok?6:Math.max(1,Math.round(right/n*4)), 6, o.comp);
    setState(root, ok?'Correct':right+'/'+n+' correct');
    if(!ok && o.flag) flag(o.flag);
    logIt('Sequence task '+(ok?'passed':'partial')+' &mdash; '+(o.name||'order'));
    S.done.add(S.page); paint();
  };
  bar.appendChild(chk); draw(); score(id,0,6,o.comp);
}

/* ==========================================================================
   4 · DRAG AND DROP INTO BINS — classification and matching
   ========================================================================== */
function cmpSort(o){
  const id=nid('s'); QUEUE.push(()=>wireSort(id,o));
  return `<div class="cmp" id="${id}">${head('Drag and drop',o.name||'Sort every item')}
    <p class="prompt">${o.prompt}</p>
    <p class="dndnote">Drag an item into a box &mdash; or tap the item, then tap the box. Tap a placed item to send it back.</p>
    <div class="chiptray" data-tray></div>
    <div class="bins" data-bins style="grid-template-columns:repeat(auto-fit,minmax(${o.wide?260:196}px,1fr))"></div>
    <div class="btnrow" data-bar></div><div class="fb" data-fb></div></div>`;
}
function wireSort(id,o){
  const root=document.getElementById(id), tray=root.querySelector('[data-tray]'),
        bins=root.querySelector('[data-bins]'), bar=root.querySelector('[data-bar]'), fb=root.querySelector('[data-fb]');
  const place={}; let picked=null, locked=false;
  const order=shuffle(o.chips.length,o.seed||29);

  o.bins.forEach(b=>{
    const d=document.createElement('div'); d.className='bin'; d.dataset.k=b.k;
    d.innerHTML=`<span class="bh">${b.label}</span><span class="bhint">${b.hint||''}</span><div class="bdrop" data-drop><span class="binempty">Empty</span></div>`;
    d.ondragover=e=>{if(!locked){e.preventDefault(); d.classList.add('over')}};
    d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault(); d.classList.remove('over'); if(locked) return;
      const ci=+e.dataTransfer.getData('text/plain'); if(!isNaN(ci)) put(ci,b.k)};
    d.onclick=()=>{ if(locked||picked===null) return; put(picked,b.k); picked=null; };
    bins.appendChild(d);
  });

  function chipEl(ci,inBin){
    const c=o.chips[ci];
    const b=document.createElement('button'); b.className='chip'; b.type='button'; b.dataset.ci=ci;
    b.innerHTML=c.t; b.draggable=!locked;
    if(picked===ci) b.classList.add('picked');
    b.ondragstart=e=>{ if(locked) return; b.classList.add('drag'); try{e.dataTransfer.setData('text/plain',String(ci))}catch(_){} };
    b.ondragend=()=>b.classList.remove('drag');
    b.onclick=e=>{
      e.stopPropagation(); if(locked) return;
      if(inBin){ delete place[ci]; picked=null; draw(); }
      else { picked = picked===ci ? null : ci; draw(); }
    };
    if(locked){
      const ok = place[ci]===c.bin;
      b.classList.add(ok?'right':'wrong');
      const target=o.bins.find(x=>x.k===c.bin);
      b.innerHTML = c.t + `<span class="cw">${ok?'':'&rarr; '+target.label+'. '}${c.why}</span>`;
    }
    return b;
  }
  function put(ci,k){ place[ci]=k; picked=null; draw(); }
  function draw(){
    tray.innerHTML='';
    const loose=order.filter(ci=>place[ci]===undefined);
    loose.forEach(ci=>tray.appendChild(chipEl(ci,false)));
    tray.classList.toggle('empty',loose.length===0);
    bins.querySelectorAll('.bin').forEach(d=>{
      const drop=d.querySelector('[data-drop]'); drop.innerHTML='';
      const mine=order.filter(ci=>place[ci]===d.dataset.k);
      if(!mine.length) drop.innerHTML='<span class="binempty">Empty</span>';
      mine.forEach(ci=>drop.appendChild(chipEl(ci,true)));
    });
    chk.disabled = locked || loose.length>0;
    setState(root, locked?'Checked':(o.chips.length-loose.length)+' of '+o.chips.length+' placed');
  }
  const chk=document.createElement('button'); chk.className='btn sm'; chk.type='button'; chk.textContent='Check placements'; chk.disabled=true;
  chk.onclick=()=>{
    locked=true; draw(); chk.disabled=true;
    const right=o.chips.filter((c,ci)=>place[ci]===c.bin).length, n=o.chips.length, ok=right===n;
    fb.className='fb show '+(ok?'pass':'fail');
    fb.innerHTML=`<span class="h">${ok?'All placed correctly':right+' of '+n+' correct'}</span>${o.explain}`;
    score(id, ok?6:Math.max(1,Math.round(right/n*4)), 6, o.comp);
    setState(root, right+'/'+n+' correct');
    if(!ok && o.flag) flag(o.flag);
    logIt('Sorting task '+(ok?'passed':'partial')+' &mdash; '+(o.name||'sort'));
    S.done.add(S.page); paint();
  };

function cmpWall(o){

    <div class="btnrow" data-bar></div><div class="fb" data-fb></div></div>`;

function wireWall(id,o){
  const root=document.getElementById(id), grid=root.querySelector('[data-body]'),
        bar=root.querySelector('[data-bar]'), fb=root.querySelector('[data-fb]');
  const sel=new Set(); let locked=false;
  o.tiles.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='tile'; b.type='button';
    b.innerHTML=`${ART[t.art]||ART.yard}<span class="tlab">${t.lab}</span>
      <span class="tstamp${t.frozen?' frozen':''}" data-st>${t.stamp}</span><span class="tmark" data-mark></span>`;
    b.onclick=()=>{ if(locked) return;
      sel.has(i)?sel.delete(i):sel.add(i); b.classList.toggle('picked');
      chk.disabled=sel.size===0; setState(root,sel.size+' selected'); };
    grid.appendChild(b);
  });
  const chk=document.createElement('button'); chk.className='btn sm'; chk.type='button'; chk.textContent='Report selected feeds'; chk.disabled=true;
  chk.onclick=()=>{
    locked=true; chk.disabled=true;
    let right=0, wrong=0;
    [...grid.children].forEach((b,i)=>{
      const t=o.tiles[i]; b.classList.add('marked'); b.classList.remove('picked');
      if(t.ok){ b.classList.add(sel.has(i)?'right':'wrong'); if(sel.has(i)) right++; else wrong++; }
      else if(sel.has(i)){ b.classList.add('wrong'); wrong++; }
      b.querySelector('[data-mark]').innerHTML=(t.ok?'&#9679; ':'')+t.why;
    });
    const total=o.tiles.filter(t=>t.ok).length, ok=right===total&&wrong===0;
    fb.className='fb show '+(ok?'pass':'fail');
    fb.innerHTML=`<span class="h">${ok?'All faults identified':right+' of '+total+' faults found'+(wrong?', with '+wrong+' misread':'')}</span>${o.explain}`;
    score(id, ok?5:Math.max(1,right), 5, o.comp);
    setState(root, ok?'Correct':right+'/'+total);
    if(!ok && o.flag) flag(o.flag);
    logIt('Feed-health check '+(ok?'passed':'partial'));
    S.done.add(S.page); paint();
  };
  bar.appendChild(chk); score(id,0,5,o.comp);
}

function cmpBranch(o){
  const id=nid('b'); QUEUE.push(()=>wireBranch(id,o));
  return `<div class="cmp" id="${id}">
    <div class="branch">
      <div class="brhead"><span class="sc">${o.code}</span><span class="ti">${o.title}</span><span class="pt" data-pt></span></div>
      <div class="brbody" data-body></div>
    </div>
    <div class="pathmap" data-map></div></div>`;
}
function wireBranch(id,o){
  const root=document.getElementById(id), body=root.querySelector('[data-body]'),
        map=root.querySelector('[data-map]'), pt=root.querySelector('[data-pt]');
  S.paths[o.code]=S.paths[o.code]||new Set();
  let trail=[], cur='start';
  const endings=Object.keys(o.nodes).filter(k=>o.nodes[k].end);

  function drawMap(){
    /* unreached endings stay masked — naming them would give away the decisions */
    map.innerHTML=`<span class="${S.paths[o.code].size?'seen':''}">Pathways explored ${S.paths[o.code].size} of ${endings.length}</span>`+
      endings.map((k,i)=>S.paths[o.code].has(k)
        ? `<span class="seen">${o.nodes[k].end.title}</span>`
        : `<span>Ending ${i+1} &mdash; not yet reached</span>`).join('');
    pt.innerHTML=`${trail.length} decision${trail.length===1?'':'s'} &middot; ${S.paths[o.code].size}/${endings.length} endings`;
  }
  function go(k,tag){
    if(tag) trail.push(tag);
    cur=k; const n=o.nodes[k];
    let h='';
    if(trail.length) h+=`<div class="trail">`+trail.map(t=>`<i class="${t[0]}">${t[1]}</i>`).join('')+`</div>`;
    if(n.feed) h+=feed(n.feed);
    h+=`<div class="node"><p class="nodetxt">${n.t}</p>`;
    if(n.end){
      h+=`<div class="outcome ${n.end.tag}"><span class="oh">${n.end.head}</span>${n.end.body}</div>`;
      h+=`<div class="btnrow">
            <button class="btn sm" data-again>Explore another pathway</button>
            ${n.end.tag==='f'?'<button class="btn sm ghost" data-again2>Retry from the start</button>':''}
          </div>`;
      S.paths[o.code].add(k);
      const cover=S.paths[o.code].size/endings.length;
      score(id, n.end.tag==='g'?8:(n.end.tag==='r'?5:2)+Math.round(cover*2), 10, o.comp);
      if(n.end.tag==='f' && o.flag) flag(o.flag);
      logIt(o.code+' outcome: '+n.end.title);
      S.done.add(S.page); paint();
    } else {
      h+=`<div class="opts" data-opts></div><div class="fb" data-fb></div>`;
    }
    h+=`</div>`;
    body.innerHTML=h;
    if(n.opts){
      const ow=body.querySelector('[data-opts]'), fb=body.querySelector('[data-fb]');
      n.opts.forEach((op,ci)=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button';
        b.innerHTML=`<span class="k">${String.fromCharCode(65+ci)}</span><span>${op.t}</span>`;
        b.onclick=()=>{
          [...ow.children].forEach(c=>c.disabled=true);
          b.classList.add(op.tag==='g'?'right':(op.tag==='f'?'wrong':'sel'));
          fb.className='fb show '+(op.tag==='g'?'pass':(op.tag==='f'?'fail':''));
          fb.innerHTML=`<span class="h">${op.tag==='g'?'Sound call':(op.tag==='f'?'This is the wrong move':'Defensible, with a cost')}</span>${op.fb}
            <div class="btnrow" style="margin-top:11px"><button class="btn sm" data-next>Continue &rarr;</button></div>`;
          fb.querySelector('[data-next]').onclick=()=>go(op.go,[op.tag,op.tag==='g'?'Sound':(op.tag==='f'?'Failure':'Costly')]);
          logIt(o.code+' &mdash; option '+String.fromCharCode(65+ci)+' chosen');
        };
        ow.appendChild(b);
      });
    }
    const again=body.querySelector('[data-again]'), again2=body.querySelector('[data-again2]');
    if(again)  again.onclick =()=>{trail=[];go('start')};
    if(again2) again2.onclick=()=>{trail=[];go('start')};
    drawMap();
  }
  score(id,0,10,o.comp);
  go('start');
}

function wireWrite(id,o){

        bar=root.querySelector('[data-bar]'), out=root.querySelector('[data-out]');
  const b=document.createElement('button'); b.className='btn sm'; b.type='button'; b.textContent='Compare with the standard';
  b.onclick=()=>{

      <p class="small muted" data-tally style="margin-top:10px">0 of ${o.checks.length} met</p></div>`;
    const boxes=[...out.querySelectorAll('input')], tally=out.querySelector('[data-tally]');
    boxes.forEach(x=>x.onchange=()=>{
      const n=boxes.filter(y=>y.checked).length;

      S.done.add(S.page); paint();
    });
    logIt('Narrative practice submitted');
    setState(root,'Compared');
  };
  bar.appendChild(b); score(id,0,5,o.comp);
}

  <h1>The record is the deliverable</h1>
  ${BAR}
  <p>The procedure's opening claim is worth reading twice: monitoring that is performed but not documented <b>cannot be billed,

        'Authorization to use talk-down is a site-level annex matter, not a live supervisory judgment about risk. And the operator watching the scene is the person best placed to apply the "will this escalate risk" test.'],
       ['No — talk-down is never used once emergency services are engaged.',false,
        'Too absolute. The procedure permits it where authorized and where it will not escalate risk; directing a response or warning of a hazard can be exactly the right use.']
     ],
     note:'Where authorized, use talk-down only if it will not escalate risk to responders or to any person on scene. When in doubt, do not.'}
  ]})}

  ${CTRL(`No operator is ever criticized for escalating an event that turned out to be less serious than it appeared.
  Operators are held accountable for failing to escalate. This asymmetry is deliberate and is stated to every operator at
  certification.`)}
 `}
},

/* ================= 13 · COMMUNICATIONS ================= */
{
 unit:'D · Critical situations', nav:'Communications discipline',
 render(){return `
  <div class="eyebrow">${SOP('SOP-GSOC-012')}</div>
  <h1>The right thing on the wrong channel</h1>
  ${BAR}
  <p>Channel discipline exists because the same sentence carries different risk depending on where you put it. The control is
  short: <b>urgency is never communicated by a channel that does not guarantee an immediate human response. A time-critical
  matter is spoken, not written.</b></p>

  ${cmpSort({
    name:'Channel discipline',
    comp:'Communications',
    prompt:'Nine messages. Put each on the channel the procedure requires — and notice which one has an absolute prohibition attached.',
    seed:89, wide:true,
    bins:[
      {k:'disp',label:'Approved dispatch channel',hint:'Officer dispatch and live coordination'},
      {k:'floor',label:'Internal floor channel',hint:'Operator to Shift Lead and Supervisor'},
      {k:'cli',label:'Client escalation channel',hint:'Level 4 notification per the annex'},
      {k:'rec',label:'Incident system of record',hint:'The authoritative record of everything'},
      {k:'em',label:'Email',hint:'Non-urgent confirmation and scheduled reporting'}
    ],
    chips:[
      {t:'"Officer to the northeast gate, two subjects, no weapon observed"',bin:'disp',why:'Live response coordination. Not used for anything that is not time-critical.'},
      {t:'"Supervisor, I have a surge across four sites and need a second console"',bin:'floor',why:'Operator to Shift Lead and Supervisor. Avoid client-identifiable detail where the channel is not access-controlled.'},
      {t:'Notifying the client duty contact of a threshold event at 03:40',bin:'cli',why:'Level 4 notification per the annex. Not used for routine updates or operator convenience.'},
      {t:'The full timeline of every action taken during the incident',bin:'rec',why:'The authoritative record of everything — and not the place for real-time urgent communication.'},
      {t:'Confirming next month\'s scheduled reporting date with the client',bin:'em',why:'Non-urgent confirmation and scheduled reporting. This is what email is for.'},
      {t:'"Site S-104 is completely dark, right now" — to the Supervisor',bin:'floor',why:'Spoken, immediately. Any urgent or life-safety matter goes on email never — the procedure uses the word "ever".'},
      {t:'A note that the dispatch channel dropped twice overnight, for the fault log',bin:'rec',why:'Logged at the time of observation with site ID and timestamp. The record carries faults, not just incidents.'},
      {t:'Telling an officer their primary dispatch channel has changed to the fallback',bin:'disp',why:'Officers are notified of a channel change on a channel that reaches them — SOP-GSOC-013 requires confirming the fallback works before relying on it.'},
      {t:'Monthly KPI summary to the client\'s named recipients',bin:'em',why:'Scheduled reporting under SOP-GSOC-016, at the cadence and format bound in the annex.'}
    ],
    explain:`<p>The prohibition to remember: <b>email is never used for any urgent or life-safety matter, ever.</b> An email is a
    message sent into an unmonitored inbox, and the sender's belief that they have communicated is the dangerous part.</p>
    <p>The corollary: identify yourself, your role, and the site at the start of every operational communication; lead with the
    most important fact rather than building to it; and distinguish confirmed fact from unconfirmed report, explicitly, every time.</p>`,
    flag:'Channel discipline not yet secure'})}

  ${cmpQuiz({name:'Notification and enquiries', comp:'Communications', items:[
    {q:'A threshold event occurred at 02:10 at a client site. At 08:30 the client calls you, having heard about it from their own site manager. What has gone wrong?',
     opts:[
       ['A procedural failure — a client learning of an incident at their own site from anyone other than the GSOC is a failure regardless of how well the incident was handled.',true,
        'The procedure states this almost word for word, and the "regardless" is the important part. Excellent incident handling does not offset a missed notification, because the client\'s ability to manage their own risk depends on knowing.'],
       ['Nothing procedural — the incident was handled and the client has now been informed.',false,
        'Notification is not a courtesy that can be satisfied late by any route. It is a Level 4 obligation with a measured time from the threshold event, and it was missed.'],
       ['A KPI miss on client notification time, but not a procedural failure.',false,
        'It is both, and treating it as only a metric misses the point. The KPI exists to measure the procedure; the procedure exists so the client is never surprised about their own site.'],
       ['The site manager should not have been told before the client\'s escalation contact.',false,
        'The site manager finding out locally is normal and not the GSOC\'s to control. The failure is that the GSOC had not already notified the authorized escalation contact.']
     ],
     note:'What to say at Level 4: what is known, what is not yet known, what the GSOC has done, and what happens next. Never speculate on cause, liability, or loss value.',
     flag:'Client notification urgency not yet internalized'},
    {q:'An attorney calls asking whether the GSOC recorded an incident at a client site last Tuesday. What do you say?',
     opts:[
       ['Route to the Program Director without confirming any detail — including whether an incident occurred.',true,
        'The procedure names attorneys alongside media, insurers, and the public, and the phrase "including whether an incident occurred" is deliberate. Confirming existence is itself a disclosure, and it can be the disclosure that matters most in litigation.'],
       ['Confirm whether a record exists, but disclose nothing about its content.',false,
        'Confirming existence is precisely what the procedure prohibits. Whether a record exists at a given site on a given date is often the fact being fished for.'],
       ['Take their details and tell them the client will be in touch.',false,

     ],
     note:'Every external enquiry is recorded, including those refused, with caller detail and the routing applied. Target for correct routing is 100 percent.'}
  ]})}
 `}

/* ================= 14 · DEGRADED OPERATIONS ================= */
{
 unit:'D · Critical situations', nav:'Degraded operations',

  <h1>Declared and managed, never quietly absorbed</h1>
  ${BAR}
  <p>This procedure exists for the moment when the GSOC itself is the thing that is broken. Its central discipline is honesty:
  <b>degraded operations are declared and managed, never quietly absorbed by the floor.</b></p>

  <p>One early-detection note worth carrying: <b>a systemic fault presenting as a single-site fault is a common early misread.
  Check a second site before concluding.</b></p>

    bins:[

      {k:'sig',label:'Significant',hint:'Level 2, declare degraded, notify Client'},
      {k:'crit',label:'Critical',hint:'Level 4, degraded, consider SOP-GSOC-014'}
    ],
    chips:[
      {t:'One camera down at a low-criticality site; the site is otherwise substantially monitored',bin:'min',why:'Minor: log, raise a support ticket, monitor, and note the gap in passdown.'},

      {t:'Talk-down capability lost across five sites; video unaffected',bin:'sig',why:'A capability lost across multiple sites is Significant even though video remains.'},

      {t:'Three high-criticality sites lost simultaneously',bin:'crit',why:'Critical: multiple high-criticality sites lost. If the floor itself is impaired, invoke SOP-GSOC-014.'}
    ],
    explain:`<p>The classification is not a label, it is a routing decision. <b>Minor stays on the floor. Significant reaches the
    Supervisor and the Client. Critical reaches the Client at Level 4 and puts failover on the table.</b></p>`,
    flag:'Impact classification not yet secure'})}

  ${cmpSort({
    name:'Compensating measures',

    prompt:'Match each loss to the compensating measure the procedure specifies. One of these has a hard prohibition attached.',
    seed:103, wide:true,
    bins:[
      {k:'a',label:'Increase sweeps, record the blind area',hint:''},
      {k:'b',label:'Request increased physical patrol',hint:''},
      {k:'c',label:'Switch to the documented manual log',hint:''},
      {k:'d',label:'Switch to the documented fallback and test it',hint:''},
      {k:'e',label:'Relocate the operator to a spare console',hint:''}
    ],
    chips:[
      {t:'Camera or partial site view lost',bin:'a',why:'Increase sweep frequency on remaining views, and note the blind area explicitly in the record and in passdown.'},
      {t:'Full site view lost',bin:'b',why:'Notify the Client, request increased physical patrol, and document the coverage gap with start and end times.'},
      {t:'Incident system unavailable',bin:'c',why:'Every entry timestamped at the moment of the action, back-loaded on restoration and marked as reconstructed with original times preserved.'},
      {t:'Primary dispatch channel down',bin:'d',why:'Confirm the fallback works before relying on it, and notify officers of the change.'},
      {t:'Workstation failure',bin:'e',why:'Relocate to a spare console. Never share a console between two operators as a workaround — the prohibition is explicit.'}
    ],
    explain:`<p>Every compensating measure has the same structure: <b>do something that partially replaces the lost capability, and
    write down exactly what is still missing.</b> The second half is what keeps a temporary gap from becoming an invisible
    permanent one.</p>`,
    flag:'Compensating measures not yet secure'})}

  ${CTRL(`The Client is told what is not being monitored, as soon as it is known. A client operating on a false belief about
  their coverage is exposed to a risk they have not accepted and cannot manage.`)}

  ${cmpQuiz({name:'Honesty about coverage', comp:'Degraded operations', items:[
    {q:'A site has been dark for forty minutes. The vendor says restoration is imminent. What do you tell the client?',
     opts:[
       ['Notify now, stating plainly what is not being monitored.',true,

       ['Wait for restoration — if it comes back in ten minutes, the notification would cause alarm for nothing.',false,

       ['Notify the Supervisor and let them decide whether the client needs to know.',false,

     ],

        'Over-notification has a cost too: it trains the client to discount your notifications. A single low-criticality camera is Minor, and Minor is logged and noted in passdown.']
     ],

  ]})}
 `}

/* ================= 15 · FAILOVER ================= */
{
 unit:'D · Critical situations', nav:'Floor failover',
 render(){return `
  <div class="eyebrow">${SOP('SOP-GSOC-014')}</div>
  <h1>When the building is the problem</h1>
  ${BAR}
  <p>The premise, stated in the procedure's own words: <b>a GSOC that stops when its own building has a problem has not
  delivered continuous monitoring, whatever the SOW says.</b></p>

  <p>The Plano floor is primary; Atlanta is the designated failover. What this procedure asks of you is narrower than the whole
  plan: understand why the transfer is done <b>site by site with named acceptance</b>, and why the primary floor does not stand
  down until that acceptance is confirmed.</p>

  ${cmpOrder({
    name:'Invocation and transfer',
    comp:'Business continuity',
    seed:107,
    prompt:'Order the failover. The last step in this list is the one the entire procedure exists to protect.',
    items:[
      {t:'Supervisor or Program Director declares failover, recording time and reason',why:'A declaration with a timestamp. Failover is never an informal drift to another room.'},
      {t:'Notify the failover floor and confirm capacity and certified staff',why:'Certified for the affected program — not merely available.'},
      {t:'Notify the Client at Level 4 with the expected transfer duration',why:'And notify officers of any change to the dispatch channel.'},
      {t:'Transfer console responsibility site by site with explicit named acceptance',why:'Applying the SOP-GSOC-009 handover standard. Urgency is exactly when this gets dropped.'},
      {t:'Transfer every open incident with its full current status',why:'Open work moves with the console, not separately from it.'},
      {t:'Confirm the failover floor has working access to the incident system, escalation matrix, and every required feed',why:'Confirmed before, not discovered after.'},
      {t:'Primary floor stands down',why:'And not one moment before acceptance is confirmed site by site. A monitoring gap during transfer is the failure mode this entire procedure exists to prevent.'}
    ],
    explain:`<p>Once operating in failover: <b>all procedures in this manual apply unchanged. Failover changes location, not
    standard.</b> Any capability reduced or unavailable at the failover floor is recorded and managed as degraded operations
    under ${SOP('SOP-GSOC-013')} &mdash; two procedures running at once, which is normal.</p>
    <p>Coming back is the same discipline in reverse, plus one addition: verify the primary floor is fully functional,
    <b>including every system, not only the one that failed.</b></p>`,
    flag:'Failover sequence not yet secure'})}

  ${cmpQuiz({name:'Failover judgment', comp:'Business continuity', items:[
    {q:'Mid-failover, the failover floor reports they can see all feeds but cannot yet reach the incident system. Can the primary floor stand down?',
     opts:[
       ['No. Working access to the incident system, the escalation matrix, and every required feed is confirmed before the primary floor stands down.',true,
        'All three are named as preconditions. A floor that can watch but cannot record is operating in breach of the contemporaneous-recording control from the moment it takes accountability — and the manual treats an unrecorded action as an action not taken.'],
       ['Yes, provided the failover floor logs manually until access is restored.',false,
        'The manual-log measure is real, but it is a compensating measure for a fault that arises during operation — not a way to launch into failover already degraded when the precondition is checkable in advance.'],
       ['Yes — feed access is the monitoring capability, and recording can catch up.',false,

       ['Yes, if the Supervisor accepts the residual risk.',false,
        'Acceptance of residual risk on an open exception is a Program Director accountability, not a Supervisor one — and it is not a route around a stated precondition during a live transfer.']
     ],
     note:'The KPI target for monitoring gap during transfer is zero minutes. Preconditions are what make zero achievable.'},
    {q:'You are an operator at the failover floor. Talk-down is unavailable to you for three of the transferred sites. What is the correct handling?',
     opts:[
       ['Record the reduced capability and manage it as degraded operations under SOP-GSOC-013, including client notification.',true,
        'SOP-GSOC-014 requires exactly this: any capability reduced or unavailable in failover is recorded and managed as degraded operations. A capability lost across multiple sites is Significant impact, which carries Level 2 and client notification.'],
       ['Nothing — talk-down is a discretionary capability and failover is a temporary state.',false,
        'The client contracted a capability at those sites and it is not available. Temporary and unrecorded is how a coverage gap becomes invisible, and the control requires the client to be told what is not being monitored.'],

     ],

     flag:'Did not manage reduced capability as degraded operations'}
  ]})}
 `}

        <p>It is not pedantry. It determines what emergency services are told and what a responding officer expects to encounter
        &mdash; and if police are called on your word, it shapes how they arrive.</p>`}},
      end_late:{t:'',end:{tag:'f',head:'Delayed escalation',title:'Watched instead of escalating',
        body:`<p>You had a verified life-safety situation &mdash; an object raised toward a person &mdash; and you spent the next
        interval gathering more certainty about something already certain enough.</p>

        escalate as if it were a life-safety event. <b>Over-escalation is recoverable; under-escalation is not.</b> Nothing you
        learned in those seconds would have changed the call, and the delay is measured &mdash; time from life-safety
        classification to emergency services contacted is described in the manual as its most consequential metric.</p>`}}
    }})}
 `}
},

     return `<tr><td>${k}</td><td style="width:120px"><div class="meter"><i class="${cls}" style="width:${pct}%"></i></div></td>
       <td style="width:86px;font-family:var(--mono);font-size:12px">${c.e} / ${c.m}</td>
       <td style="width:56px;font-family:var(--mono);font-size:12px">${pct}%</td></tr>`;
   }).join('');
   const scen=['SC-16','SC-17','SC-18','SC-19','SC-20'].map(c=>{
     const n=(S.paths[c]||new Set()).size;
     return `<tr><td>${c}</td><td>${n===0?'<span class="muted">Not attempted</span>':n+' ending'+(n===1?'':'s')+' reached'}</td>
       <td class="${n>=2?'good':(n===1?'risk':'muted')}" style="font-family:var(--mono);font-size:12px">${n>=2?'Explored':(n===1?'Single path':'—')}</td></tr>`;
   }).join('');

   return `
  <div class="eyebrow">Completion record</div>
  <h1>${S.learner?S.learner:'Operator learning record'}</h1>
  ${BAR}
  <p class="small muted" style="font-family:var(--mono)">GSOC-TRN-004 &middot; Self-paced operator learning module &middot;
  ${new Date().toLocaleString()} &middot; Elapsed ${mins} minute${mins===1?'':'s'}</p>

  <div class="scoregrid">
    <div class="sc"><b>${t.pct}%</b><span>Overall</span><div class="meter"><i class="${t.pct>=85?'g':(t.pct>=60?'r':'f')}" style="width:${t.pct}%"></i></div></div>
    <div class="sc"><b>${t.e}/${t.m}</b><span>Points earned</span></div>
    <div class="sc"><b>${S.done.size}/${SECTIONS.length}</b><span>Sections worked</span></div>
    <div class="sc"><b>${['SC-16','SC-17','SC-18','SC-19','SC-20'].reduce((a,c)=>a+((S.paths[c]||new Set()).size),0)}</b><span>Scenario endings reached</span></div>
  </div>

  <h2>Competency breakdown</h2>
  <table><tr><th>Competency</th><th>Level</th><th>Points</th><th></th></tr>${scRows||'<tr><td colspan="4" class="muted">No activities attempted yet.</td></tr>'}</table>

  <h2>Scenario coverage</h2>
  <p class="small muted">Reaching a single ending shows you can work a path. Reaching two or more shows you understand why the
  other path was wrong &mdash; which is the point of the exercise.</p>
  <table><tr><th>Scenario</th><th>Pathways</th><th></th></tr>${scen}</table>

  <h2>Points for the mentor conversation</h2>
  ${S.flags.length
    ? `<div class="card"><p class="small muted" style="margin-bottom:10px">These are prompts for discussion under
       ${SOP('SOP-GSOC-017')}, not deficiencies. Bring them to your mentor.</p><ul>${S.flags.map(f=>`<li>${f}</li>`).join('')}</ul></div>`
    : `<div class="card takeaway"><h3>No flags raised</h3><p>Nothing in this run indicated a gap worth a targeted conversation.
       That is a good sign and it is not a certification &mdash; scenario-based practical work under real supervision carries
       more weight than any module.</p></div>`}

  <div class="card">
    <h3>What this record is, and is not</h3>
    <p class="small">This is training evidence. Console certification is a decision made by the Training Lead under
    ${SOP('SOP-GSOC-002')}, on a body of evidence that includes written assessment, practical assessment, scenario work with a
    live debrief, and supervised console time. ${SOP('SOP-GSOC-017')} is explicit that scenario-based practical work carries more
    weight than classroom time: operators are assessed on what they do, not on what they can recite.</p>
    <p class="small">Every scenario in this module should be debriefed against the relevant SOP with a mentor, identifying both
    what was done well and what would be done differently.</p>
  </div>

  <div class="ctrl"><span class="lab">Before your first live shift</span>
  <p>Confirm with your Training Lead that the program values marked <span class="confirm">[CONFIRM]</span> throughout this module
  have been bound in the applicable Program Annex &mdash; acknowledgement target, retention periods, patrol cadence, overlap
  duration, dispatch method and fallback, talk-down authorization, report-back interval, notification thresholds, and per-site
  jurisdiction requirements. A program does not go live with an incomplete annex.</p></div>

  <div class="btnrow">
    <button class="btn" onclick="window.print()">Print or save this record</button>
    <button class="btn ghost" onclick="go(0)">Back to the start</button>
  </div>

  <div class="docstrip">${TRIO}<span>Specialized GSOC</span><span>GSOC-TRN-004</span><span>v0.1 Draft</span>
    <span>Internal &mdash; operational</span><span class="pg">End of module</span></div>
 `}
}
];
</script>
<script>
/* ==========================================================================
   Router
   ========================================================================== */
SECTIONS.forEach((s,i)=>{ UNIT_OF[i]=s.unit; });

function paint(){
  const rail=document.getElementById('rail');
  rail.innerHTML='<div class="railhead">Module contents</div>';
  let lastUnit=null;
  SECTIONS.forEach((s,i)=>{
    if(s.unit!==lastUnit){
      const u=document.createElement('div');
      u.className='railunit'; u.textContent=s.unit;
      rail.appendChild(u); lastUnit=s.unit;
    }
    const b=document.createElement('button');
    b.className='navitem'+(i===S.page?' on':'')+(S.done.has(i)?' done':'');
    b.innerHTML='<span class="n">'+String(i).padStart(2,'0')+'</span><span>'+s.nav+'</span>';
    b.onclick=()=>go(i);
    rail.appendChild(b);
  });
  document.getElementById('progbar').style.width=(S.done.size/SECTIONS.length*100)+'%';
}

function go(i){
  S.page=i;
  QUEUE=[];
  const m=document.getElementById('main');
  m.innerHTML=SECTIONS[i].render();
  QUEUE.forEach(fn=>{ try{ fn(); }catch(e){ console.error('mount',e); } });
  QUEUE=[];
  if(SECTIONS[i].init) SECTIONS[i].init();
  if(i===0||i===SECTIONS.length-1) S.done.add(i);

  const nav=document.createElement('div');
  nav.className='btnrow'; nav.style.marginTop='36px';
  if(i>0){
    const p=document.createElement('button');
    p.className='btn ghost'; p.textContent='\u2190 Back'; p.onclick=()=>go(i-1);
    nav.appendChild(p);
  }
  if(i<SECTIONS.length-1){
    const n=document.createElement('button');
    n.className='btn'; n.textContent='Continue \u2192'; n.onclick=()=>go(i+1);
    nav.appendChild(n);
  }
  m.appendChild(nav);

  if(i>0 && i<SECTIONS.length-1){
    const strip=document.createElement('div');
    strip.className='docstrip';
    strip.innerHTML=TRIO+'<span>Specialized GSOC</span><span>GSOC-TRN-004</span><span>v0.1 Draft</span>'+
      '<span>Internal &mdash; operational</span><span class="pg">'+String(i).padStart(2,'0')+' / '+String(SECTIONS.length-1).padStart(2,'0')+'</span>';
    m.appendChild(strip);
  }
  paint();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight'&&S.page<SECTIONS.length-1) go(S.page+1);
  if(e.key==='ArrowLeft'&&S.page>0) go(S.page-1);
});

go(0);
</script>
